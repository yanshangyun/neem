<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>neem</title>
  <meta name="description" content="Neem Interactive is an independent video game publisher and studio partnering with creators worldwide to bring bold, original games to life.">
  <link rel="canonical" href="https://neem.com/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://neem.com/">
  <meta property="og:site_name" content="Neem Interactive — Render Your Reality">
  <meta property="og:title" content="Neem Interactive — Render Your Reality">
  <meta property="og:description" content="Neem Interactive is an independent video game publisher and studio partnering with creators worldwide to bring bold, original games to life.">
  <meta property="og:image" content="https://neem.com/assets/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Neem Interactive — Render Your Reality">
  <meta name="twitter:description" content="Neem Interactive is an independent video game publisher and studio partnering with creators worldwide to bring bold, original games to life.">
  <meta name="twitter:image" content="https://neem.com/assets/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" id="favicon">
  <style>
    :root {
      --color: RGB(255, 255, 255);
      --color-bg: RGB(123, 198, 156);
      --stroke-width: 0.75;
    }

    html {
      background: var(--color-bg);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--color-bg);
      cursor: default;
      animation:forwards backgroundFade 1s ease-in-out;
      user-select:none;
    }

    @keyframes backgroundFade{
      from { background-color: var(--color); }
      to { background-color: var(--color-bg); }
    }

    /* sentinel gives the safe-area-adjusted floor y */
    #nav-sentinel {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    #nav-circle {
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color);
      border: none;
      padding: 0;
      cursor: help;
      z-index: 10;
      flex-shrink: 0;
    }

    #nav-link {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      font-family: "Familjen Grotesk", sans-serif;
      font-size: 14px;
      white-space: nowrap;
      color: var(--color-bg);
      text-decoration: none;
      border-radius: 10px;
      padding: 0px 8px 2px 8px;
      border: 1px solid var(--color);
      background-color: var(--color);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    #nav-link:hover {
      background-color: transparent;
      color: var(--color);
    }

    #nav-size {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      font-family: "Familjen Grotesk", sans-serif;
      font-size: 14px;
      white-space: nowrap;
      color: var(--color);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #nav-size { display: none; }
      #nav-link { font-size: 13px; }
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: var(--color);
    }

    line, rect {
      stroke: none;
      stroke-width: var(--stroke-width);
    }

    #scene path {
      fill: var(--color);
      stroke: var(--color-bg);
      paint-order: stroke fill;
      overflow: visible;
    }

    #scene g > svg {
      overflow: visible;
    }

    #scene.locked path {
      stroke: none;
    }

    #scene g {
      pointer-events: all;
      cursor: grab;
    }

    #scene g rect {
      pointer-events: all;
    }

    @media (hover: hover) {
      #scene:not(.locked) g:hover rect {
        fill: var(--color);
      }
      #scene:not(.locked) g:hover path {
        fill: var(--color-bg);
        stroke: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .extra-ui {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
      animation-delay: 2s;
    }

    #wishlist-catcher {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
    }

    #wishlist-catcher.active { display: block; }

    #wishlist-box {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 11;
      box-sizing: border-box;
      background-color: var(--color);
      color: var(--color-bg);
      font-family: "Familjen Grotesk", sans-serif;
      overflow-y: hidden;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      min-height: 320px;
      padding: 32px;
    }

    #wishlist-box.active { display: flex; }

    #wishlist-box .wl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      line-height: 1.4;
      margin-top: auto;
    }

    #wishlist-box .wl-table td {
      text-align: left;
      font-weight: normal;
      padding: 8px 0;
      vertical-align: baseline;
      border-top: 1px solid color-mix(in srgb, var(--color-bg) 35%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--color-bg) 35%, transparent);
    }

    #wishlist-box .wl-table td:first-child {
      white-space: nowrap;
      padding-right: 24px;
    }

    #wishlist-box .wl-table td:last-child {
      width: 1%;
      white-space: nowrap;
      text-align: right;
    }

    @media (max-width: 600px) {
      #wishlist-box .wl-table td:last-child {
        width: auto;
        white-space: normal;
      }
    }

    #wishlist-box .wl-logo {
      display: block;
      height: 20px;
      width: auto;
      color: inherit;
      align-self: center;
    }

    #wishlist-box .wl-table tr {
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1);
    }

    #wishlist-box .wl-link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    #wishlist-box .wl-note {
      font-size: 16px;
      line-height: 1.5;
      margin-top: auto;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1);
      text-align: center;
    }

    #wishlist-box.content-visible .wl-table tr,
    #wishlist-box.content-visible .wl-note { opacity: 1; }

    #wishlist-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--color-bg);
      background: none;
      color: var(--color-bg);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1), background-color 0.15s ease, color 0.15s ease;
    }

    #wishlist-box.content-visible #wishlist-close { opacity: 1; }

    #wishlist-close:hover {
      background: var(--color-bg);
      color: var(--color);
    }
  </style>
</head>
<body>
  <div id="nav-sentinel"></div>
  <button id="nav-circle" class="extra-ui"></button>
  <a id="nav-link">Games</a>
  <span id="nav-size" class="extra-ui"></span>

  <svg id="scene" class="locked">
    <!-- 3 sets of 4 lines: n↔e1, e1↔e2, e2↔m -->
    <line id="s1-tl"/><line id="s1-tr"/>
    <line id="s1-bl"/><line id="s1-br"/>
    <line id="s2-tl"/><line id="s2-tr"/>
    <line id="s2-bl"/><line id="s2-br"/>
    <line id="s3-tl"/><line id="s3-tr"/>
    <line id="s3-bl"/><line id="s3-br"/>
    <!-- rects in reading order: n, e-1, e-2, m -->
    <g id="g-n">
      <rect id="r-n" fill="none"/>
      <svg id="img-n" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
    <g id="g-e1">
      <rect id="r-e1" fill="none"/>
      <svg id="img-e1" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
    <g id="g-e2">
      <rect id="r-e2" fill="none"/>
      <svg id="img-e2" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
    <g id="g-m">
      <rect id="r-m" fill="none"/>
      <svg id="img-m" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
  </svg>

  <div id="wishlist-catcher"></div>
  <div id="wishlist-box">
    <button id="wishlist-close" aria-label="Close">&times;</button>
    <svg id="img-logo" class="wl-logo" preserveAspectRatio="xMinYMid meet"></svg>
    <table class="wl-table">
      <tbody>
        <tr>
          <td>GRAIN ROT</td>
          <td><a class="wl-link" href="https://store.steampowered.com/app/4450620/GRAIN_ROT/?utm_source=neem&amp;utm_medium=website&amp;utm_campaign=publisher_site&amp;utm_content=grain_rot" target="_blank" rel="noopener">Steam  &#8599;&#xFE0E;</a></td>
        </tr>
      </tbody>
    </table>
    <p class="wl-note">More unannounced titles to come.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
