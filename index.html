<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" id="favicon">
  <style>
    :root {
      --color: RGB(255, 255, 255);
      --color-bg: RGB(123, 198, 156);
      --stroke-width: 0.75;
      --pill-fg: var(--color);
      --pill-bg: var(--color-bg);
    }

    html {
      background: var(--color-bg);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--color-bg);
      cursor: default;
      user-select:none;
    }

    /* sentinel gives the safe-area-adjusted floor y */
    #nav-sentinel {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    #nav-circle {
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0;
      background: var(--color);
      border: none;
      padding: 0;
      cursor: help;
      z-index: 10;
      flex-shrink: 0;
    }

    #nav-pair {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      font-family: "Familjen Grotesk", sans-serif;
      font-size: 14px;
      white-space: nowrap;
      text-decoration: none;
      border-radius: 16px;
      padding: 0px 8px 2px 8px;
      border: 1px solid var(--pill-fg);
      cursor: pointer;
      transition: background-color 0.15s cubic-bezier(.38,0,.1,1), color 0.15s cubic-bezier(.38,0,.1,1), border-radius 0.15s cubic-bezier(.38,0,.1,1);
    }

    .pill:hover,
    .pill.pill-active {
      border-radius: 0;
    }

    .pill-fill {
      color: var(--pill-bg);
      background-color: var(--pill-fg);
    }

    .pill-fill:hover {
      background-color: transparent;
      color: var(--pill-fg);
    }

    .pill-outline {
      color: var(--pill-fg);
      background-color: transparent;
    }

    .pill-outline:hover {
      background-color: var(--pill-fg);
      color: var(--pill-bg);
    }

    #nav-size {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      font-family: "Familjen Grotesk", sans-serif;
      font-size: 14px;
      white-space: nowrap;
      color: var(--color);
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #nav-size { display: none; }
      .pill { font-size: 13px; }
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: var(--color);
    }

    line, rect {
      stroke: none;
      stroke-width: var(--stroke-width);
    }

    #scene path {
      fill: var(--color);
      stroke: var(--color-bg);
      paint-order: stroke fill;
      overflow: visible;
    }

    #scene g > svg {
      overflow: visible;
    }

    #scene.locked path {
      stroke: none;
    }

    #scene g {
      pointer-events: all;
      cursor: grab;
    }

    #scene g rect {
      pointer-events: all;
    }

    @media (hover: hover) {
      #scene:not(.locked) g:hover rect {
        fill: var(--color);
      }
      #scene:not(.locked) g:hover path {
        fill: var(--color-bg);
        stroke: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #g-n, #g-e1, #g-e2, #g-m {
      opacity: 0;
      animation: fadeIn 0.5s cubic-bezier(.38,0,.1,1) forwards;
    }
    #g-n  { animation-delay: 0s; }
    #g-e1 { animation-delay: 0.1s; }
    #g-e2 { animation-delay: 0.2s; }
    #g-m  { animation-delay: 0.3s; }

    .extra-ui {
      opacity: 0;
      animation: fadeIn 0.7s ease-in-out forwards;
      animation-delay: 0.8s;
    }

    #wishlist-catcher {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
    }

    #wishlist-catcher.active { display: block; }

    #wishlist-box {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 11;
      box-sizing: border-box;
      background-color: var(--color);
      color: var(--color-bg);
      font-family: "Familjen Grotesk", sans-serif;
      overflow-y: hidden;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      padding: 32px;
      --pill-fg: var(--color-bg);
      --pill-bg: var(--color);
    }

    #wishlist-box.active { display: flex; }

    #wishlist-box:not(.mode-contact) #wl-contact-content { display: none; }
    #wishlist-box.mode-contact #wl-games-content { display: none; }

    #wishlist-box .wl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      line-height: 1.4;
      margin-top: 32px;
    }

    #wishlist-box .wl-table td {
      text-align: left;
      font-weight: normal;
      padding: 16px 0;
      vertical-align: baseline;
      border-top: 1px solid color-mix(in srgb, var(--color-bg) 35%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--color-bg) 35%, transparent);
    }

    #wishlist-box .wl-table td:first-child {
      white-space: nowrap;
      padding-right: 24px;
    }

    #wishlist-box .wl-table td:last-child {
      text-align: left;
    }

    #wishlist-box .wl-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px 6px;
    }

    #wishlist-box .wl-logo {
      display: block;
      height: 20px;
      width: auto;
      color: inherit;
      align-self: center;
      flex-shrink: 0;
    }

    #wishlist-box .wl-table tr {
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1);
    }

    @media (max-width: 600px) {
      #wishlist-box {
        padding: 24px;
      }

      #wishlist-box .wl-table {
        font-size: 14px;
      }

      #wishlist-box .wl-table td:first-child {
        padding-right: 12px;
      }

      #wishlist-box .wl-contact-line {
        font-size: 14px;
      }
    }

    #wishlist-box .wl-note {
      font-size: 16px;
      line-height: 1.5;
      margin-top: 32px;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1);
      text-align: center;
    }

    #wishlist-box.content-visible .wl-table tr,
    #wishlist-box.content-visible .wl-note,
    #wishlist-box.content-visible .wl-contact-line { opacity: 1; }

    #wishlist-box .wl-contact-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 0;
      margin-top: 32px;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1);
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    #wishlist-box .wl-contact-line + .wl-contact-line {
      margin-top: 24px;
    }

    #wishlist-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--color-bg);
      background: none;
      color: var(--color-bg);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(.7,0,.07,1), background-color 0.15s cubic-bezier(.38,0,.1,1), color 0.15s cubic-bezier(.38,0,.1,1);
    }

    #wishlist-box.content-visible #wishlist-close { opacity: 1; }

    #wishlist-close:hover {
      background: var(--color-bg);
      color: var(--color);
    }
  </style>
</head>
<body>
  <div id="nav-sentinel"></div>
  <button id="nav-circle"></button>
  <div id="nav-pair" class="extra-ui">
    <a id="nav-link" class="pill pill-fill">Games</a>
    <a id="nav-contact" class="pill pill-outline">Contact</a>
  </div>
  <span id="nav-size"></span>

  <svg id="scene" class="locked">
    <line id="s1-tl"/><line id="s1-tr"/>
    <line id="s1-bl"/><line id="s1-br"/>
    <line id="s2-tl"/><line id="s2-tr"/>
    <line id="s2-bl"/><line id="s2-br"/>
    <line id="s3-tl"/><line id="s3-tr"/>
    <line id="s3-bl"/><line id="s3-br"/>
    <g id="g-n">
      <rect id="r-n" fill="none"/>
      <svg id="img-n" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
    <g id="g-e1">
      <rect id="r-e1" fill="none"/>
      <svg id="img-e1" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
    <g id="g-e2">
      <rect id="r-e2" fill="none"/>

    </g>
    <g id="g-m">

      <svg id="img-m" preserveAspectRatio="xMidYMid meet"></svg>
    </g>
  </svg>

  <div id="wishlist-catcher"></div>
  <div id="wishlist-box">
    <button id="wishlist-close" aria-label="Close">&times;</button>
    <svg id="img-logo" class="wl-logo" preserveAspectRatio="xMinYMid meet"></svg>

    <table class="wl-table">

              <a class="pill pill-outline" href="https://store.steampowered.com/app/1957780/Ghosts_of_Tabor/?utm_source=neem&utm_medium=website&utm_campaign=publisher_site&utm_content=ghosts_of_tabor" target="_blank" rel="noopener">Steam</a>
              <a class="pill pill-outline" href="https://store.playstation.com/en-us/concept/10011844/" target="_blank" rel="noopener">Playstation</a>

        </tr>
        <tr>
          <td>Ghosts of Tabor: LEGACY</td>
          <td>
            <div class="wl-links">
              <a class="pill pill-outline" href="https://www.meta.com/experiences/ghosts-of-tabor-legacy/964643299532542/?srsltid=AfmBOooIY-C8ndpRqXfB-ltkQK7wQVvRDLXMhCCmP8LXwWKZkzndKKxc" target="_blank" rel="noopener">Quest</a>
              <a class="pill pill-outline" href="https://store.steampowered.com/app/4836070/Ghosts_of_Tabor__LEGACY/" target="_blank" rel="noopener">Steam</a>

    <p class="wl-note">More unannounced titles to come.</p>
    </div>
    <div id="wl-contact-content">
      <div class="wl-contact-line">
        <span>Media and creator requests</span>
        <a class="pill pill-outline" href="mailto:press@neem.com">press@neem.com</a>

      <div class="wl-contact-line">
        <span>General correspondence</span>
        <a class="pill pill-outline" href="mailto:info@neem.com">info@neem.com</a>

  </div>

  <script src="script.js"></script>
</body>
